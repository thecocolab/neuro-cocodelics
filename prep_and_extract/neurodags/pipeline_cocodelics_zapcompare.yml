# AUTO-GENERATED by make_zapcompare_pipeline.py — DO NOT EDIT BY HAND.
# ZapLine A/B: Fixed (adaptive=False) vs Adaptive (adaptive=True), both
# line_freq=50, n_harmonics=2. Two full classical feature sets with distinct
# names (…Fixed / …Adaptive) + a PrepSpectrum QC figure each, so the 50/100 Hz
# residual can be compared at both the PSD and feature level on the same subjects.
# Regenerate: .venv/bin/python make_zapcompare_pipeline.py

datasets: datasets_cocodelics.yml
mount_point: fir
new_definitions:
- custom_nodes.py
n_jobs: 1
joblib_backend: loky
joblib_prefer: processes
DerivativeDefinitions:
  PickedRaw:
    overwrite: false
    save: true
    for_dataframe: false
    nodes:
    - id: 0
      derivative: SourceFile
    - id: 1
      node: pick_meg_clean_names
      args:
        mne_object: id.0
        save: true
  RawMegSpectrum:
    overwrite: false
    save: true
    for_dataframe: false
    nodes:
