        mne_object: id.0
        title: Raw MEG spectrum (pre-denoise)
  PrepDur30Ov20Fixed:
    overwrite: false
    save: true
    for_dataframe: false
    nodes:
    - id: 0
      derivative: PickedRaw.fif
    - id: 1
      node: zapline_denoise
      args:
        mne_object: id.0
        line_freq: 50.0
        n_harmonics: 2
        adaptive: false
    - id: 2
      node: basic_preprocessing
      args:
        mne_object: id.1
        notch_filter: null
        filter_args:
          l_freq: 0.1
          h_freq: 150
        epoch_config:
          duration: 30.0
          overlap: 20.0
        resample: 600
        extra_artifacts: false
