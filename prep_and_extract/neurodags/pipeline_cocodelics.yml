# cocodelics feature extraction — neurodags port of the coco-pipe r2c pipeline.
#
# Reproduces coco-pipe's `features@prepDur30Ov20` classical-complexity battery
# (the feature set the downstream ML actually consumes) using neurodags built-in
# nodes only — no custom nodes required.
#
# prepare() parity (from r2c redefinitions_cocosprint.py:1010):
#   notch [50,100,150] Hz -> bandpass 0.1-150 Hz -> epoch 30s/20s-overlap -> resample 600 Hz
#   (neurodags basic_preprocessing applies these in the same order.)
#
# Two derivative tiers:
#   Ep_*            per-epoch feature, dims (epochs, channels[, ...]); cached, not in dataframe.
#   *MeanEpochs /   epoch-aggregated scalar-per-channel; for_dataframe: True -> these become
#   *SDEpochs /       the columns of `neurodags dataframe`.
#   *VarEpochs
#
# Column naming: neurodags emits `<DerivName>@channels-<sensor>`. To feed the existing
# ML (run_ml.py expects `feature-<f>.spaces-<sensor>`), either set run_ml `sep: "@channels-"`,
# `reverse: false` OR run `to_cocopipe_columns.py` on the output CSV. See README.

datasets: datasets_cocodelics.yml
mount_point: fir          # override with `-d`/edit for local; use `local` for a local mirror
new_definitions:          # list -> load BOTH the validated + experimental node modules
  - custom_nodes.py            # pick_meg_clean_names (CTF sensor pick + name cleanup)
  - experimental_features.py   # EXPERIMENTAL scientific features (phi/IIT, Fisher, Harmonicity)

n_jobs: 1                 # per-file parallelism; on cluster prefer slurm arrays (see README)
joblib_backend: loky
joblib_prefer: processes

DerivativeDefinitions:

  # ----- MEG pick + clean names (shared raw for the QC figure + the prep) -------
  PickedRaw:
    overwrite: False
    save: True                         # persisted so RawMegSpectrum + PrepDur30Ov20 can read it
    for_dataframe: False
    nodes:
      - id: 0
        derivative: SourceFile
      - id: 1
        node: pick_meg_clean_names     # keep CTF MEG sensors only + strip -<runid> suffix
        args: {mne_object: id.0, save: True}

  # ----- QC: raw MEG spectrum figure (BEFORE denoise/filter) --------------------
  # A .png inspection artifact — mean PSD across MEG channels, 50/60 Hz marked — to
  # eyeball the true line frequency + data quality per subject before trusting the prep.
  RawMegSpectrum:
    overwrite: False
    save: True
    for_dataframe: False
    nodes:
      - id: 0
        derivative: PickedRaw.fif
      - id: 1
        node: meg_spectrum_fig
        args: {mne_object: id.0, title: "Raw MEG spectrum (pre-denoise)"}

  # ----- Preprocessing: ZapLine line-noise -> bandpass -> epoch -> resample ------
  # ZapLine (mne-denoise) replaces the notch: removes the line component (+harmonics) via DSS
  # while preserving neural signal. line_freq=50: the RawMegSpectrum QC figures show a clear 50 Hz
  # line (+ 100 Hz harmonic, strong in perampanel) and NOTHING at 60 across datasets — i.e. these
  # are 50 Hz-mains (UK/EU) sites, so the datasets_cocosprint.yml PowerLineFrequency=60 is wrong and
  # r2c's hardcoded 50/100/150 notch was correct.
  #
  # CONFIG CHOSEN via the ZapLine A/B (job 47827555) + parameter sweep (job 47939632):
  #  - adaptive=True (ZapLine-plus) beat adaptive=False on 50 Hz in ALL 5 datasets and 100 Hz in 4/5.
  #  - n_harmonics=2 is REQUIRED to touch 100 Hz — adaptive mode does NOT auto-clean harmonics
  #    (the old comment claiming it did was wrong; QC showed 100 Hz fully intact without it).
  #  - The sweep confirmed adaptive removes many components across chunks (335/379) while preserving
  #    signal (keep~0.99), reducing 50 Hz from raw ~5.5-8x to ~3.7-4.8x on the continuous data.
  #    A ~3.7-4.8x narrow-bin residual remains and is inherent: adaptive_params (sigma/min_remove/
  #    max_prop) had NO effect (self-regulating detection), and standard mode with explicit n_remove
  #    up to 8 did WORSE. So this is the best available operating point. (The scarier "8-21x" seen on
  #    the epoched+resampled prep is a finer-Welch-resolution artifact, not extra residual.)
  PrepDur30Ov20:
    overwrite: False
    save: True
    for_dataframe: False
    nodes:
      - id: 0
        derivative: PickedRaw.fif
      - id: 1
        node: zapline_denoise
        # adaptive=True -> ZapLine-plus (Klug & Kloosterman 2022): data segmentation + spectral-QA
        # so it removes only as much as needed (gentler than the plain DSS notch we first saw).
        # n_harmonics=2 -> also DSS-clean the 100 Hz harmonic (NOT automatic in adaptive mode).
        args: {mne_object: id.0, line_freq: 50.0, adaptive: True, n_harmonics: 2}
      - id: 2
        node: basic_preprocessing
        args:
          mne_object: id.1
          notch_filter: null            # line noise handled by ZapLine above
          filter_args:
            l_freq: 0.1
            h_freq: 150
          epoch_config:
            duration: 30.0
            overlap: 20.0
          resample: 600
          extra_artifacts: False

  # ----- QC: post-prep MEG spectrum (after ZapLine + bandpass + resample) --------
  # Pair with RawMegSpectrum to eyeball the line removal + bandpass shape per subject.
  PrepSpectrum:
    overwrite: False
    save: True
    for_dataframe: False
    nodes:
      - id: 0
        derivative: PrepDur30Ov20.fif
      - id: 1
        node: meg_spectrum_fig
        args: {mne_object: id.0, title: "Prepped MEG spectrum (post ZapLine+bandpass)"}

  # ===== Per-epoch features (intermediate, cached) ==============================
  # xarray view of the epoched prep (dims: epochs, spaces, times). Needed because
  # `binarize_with_median` only reads an xarray/.nc, not an MNE .fif — so we
  # materialize the conversion as its own cached derivative and feed its .nc in.
  Ep_XarrayEpochs:
    save: True
    for_dataframe: False
    nodes:
      - id: 0
        derivative: PrepDur30Ov20.fif
      - id: 1
        node: meeg_to_xarray
        args: {mne_object: id.0}

  Ep_LZivComplexity:
    save: True
    for_dataframe: False
    nodes:
      - id: 0
        derivative: Ep_XarrayEpochs.nc      # .nc path -> binarize can open it
      - id: 1
        node: binarize_with_median
        args: {data: id.0, dim: 'times'}
      - id: 2
        node: antropy_lziv_complexity
        args: {data_like: id.1, dim: 'times'}

  Ep_HiguchiFD:
    save: True
    for_dataframe: False
    nodes:
      - id: 0
        derivative: PrepDur30Ov20.fif
      - id: 1
        node: antropy_higuchi_fd
        args: {data_like: id.0, dim: 'times'}

  Ep_KatzFD:
    save: True
    for_dataframe: False
    nodes:
      - id: 0
        derivative: PrepDur30Ov20.fif
      - id: 1
        node: antropy_katz_fd
        args: {data_like: id.0, dim: 'times'}

  Ep_PetrosianFD:
    save: True
    for_dataframe: False
    nodes:
      - id: 0
        derivative: PrepDur30Ov20.fif
      - id: 1
        node: antropy_petrosian_fd
        args: {data_like: id.0, dim: 'times'}

  Ep_SVDEntropy:
    save: True
    for_dataframe: False
    nodes:
      - id: 0
        derivative: PrepDur30Ov20.fif
      - id: 1
        node: antropy_svd_entropy
        args: {data_like: id.0, dim: 'times'}

  Ep_NumZeroCross:
    save: True
    for_dataframe: False
    nodes:
      - id: 0
        derivative: PrepDur30Ov20.fif
      - id: 1
        node: antropy_num_zerocross
        args: {data_like: id.0, dim: 'times'}

  Ep_PermEntropy:
    save: True
    for_dataframe: False
    nodes:
      - id: 0
        derivative: PrepDur30Ov20.fif
      - id: 1
        node: antropy_perm_entropy
        args: {data_like: id.0, dim: 'times'}

  Ep_SpectralEntropy:
    save: True
    for_dataframe: False
    nodes:
      - id: 0
        derivative: PrepDur30Ov20.fif
      - id: 1
        node: antropy_spectral_entropy
        args: {data_like: id.0, dim: 'times', sf: 600.0}

  Ep_HjorthParams:
    save: True
    for_dataframe: False
    nodes:
      - id: 0
        derivative: PrepDur30Ov20.fif
      - id: 1
        node: antropy_hjorth_params
        args: {data_like: id.0, dim: 'times'}   # -> result dim 'hjorthComponents' = [mobility, complexity]

  Ep_DetrendedFluctuation:
    save: True
    for_dataframe: False
    nodes:
      - id: 0
        derivative: PrepDur30Ov20.fif
      - id: 1
        node: antropy_detrended_fluctuation
        args: {data_like: id.0, dim: 'times'}

  # ===== Epoch aggregation -> dataframe features ================================
  lzivComplexityMeanEpochs:
    save: True
    for_dataframe: True
    nodes:
      - id: 0
        derivative: Ep_LZivComplexity.nc
      - id: 1
        node: aggregate_across_dimension
        args: {xarray_data: id.0, dim: 'epochs', operation: 'mean'}

  higuchiFdMeanEpochs:
    save: True
    for_dataframe: True
    nodes:
      - id: 0
        derivative: Ep_HiguchiFD.nc
      - id: 1
        node: aggregate_across_dimension
        args: {xarray_data: id.0, dim: 'epochs', operation: 'mean'}

  higuchiFdVarEpochs:
    save: True
    for_dataframe: True
    nodes:
      - id: 0
        derivative: Ep_HiguchiFD.nc
      - id: 1
        node: aggregate_across_dimension
        args: {xarray_data: id.0, dim: 'epochs', operation: 'var'}

  katzFdMeanEpochs:
    save: True
    for_dataframe: True
    nodes:
      - id: 0
        derivative: Ep_KatzFD.nc
      - id: 1
        node: aggregate_across_dimension
        args: {xarray_data: id.0, dim: 'epochs', operation: 'mean'}

  katzFdSDEpochs:
    save: True
    for_dataframe: True
    nodes:
      - id: 0
        derivative: Ep_KatzFD.nc
      - id: 1
        node: aggregate_across_dimension
        args: {xarray_data: id.0, dim: 'epochs', operation: 'std'}

  petrosianFdMeanEpochs:
    save: True
    for_dataframe: True
    nodes:
      - id: 0
        derivative: Ep_PetrosianFD.nc
      - id: 1
        node: aggregate_across_dimension
        args: {xarray_data: id.0, dim: 'epochs', operation: 'mean'}

  svdEntropyMeanEpochs:
    save: True
    for_dataframe: True
    nodes:
      - id: 0
        derivative: Ep_SVDEntropy.nc
      - id: 1
        node: aggregate_across_dimension
        args: {xarray_data: id.0, dim: 'epochs', operation: 'mean'}

  numZerocrossMeanEpochs:
    save: True
    for_dataframe: True
    nodes:
      - id: 0
        derivative: Ep_NumZeroCross.nc
      - id: 1
        node: aggregate_across_dimension
        args: {xarray_data: id.0, dim: 'epochs', operation: 'mean'}

  permEntropyMeanEpochs:
    save: True
    for_dataframe: True
    nodes:
      - id: 0
        derivative: Ep_PermEntropy.nc
      - id: 1
        node: aggregate_across_dimension
        args: {xarray_data: id.0, dim: 'epochs', operation: 'mean'}

  spectralEntropyMeanEpochs:
    save: True
    for_dataframe: True
    nodes:
      - id: 0
        derivative: Ep_SpectralEntropy.nc
      - id: 1
        node: aggregate_across_dimension
        args: {xarray_data: id.0, dim: 'epochs', operation: 'mean'}

  # hjorth mobility + complexity together (dims: channels x hjorthComponents).
  # Flattens to `hjorthMeanEpochs@channels-<S>_hjorthComponents-mobility` etc.
  hjorthMeanEpochs:
    save: True
    for_dataframe: True
    nodes:
      - id: 0
        derivative: Ep_HjorthParams.nc
      - id: 1
        node: aggregate_across_dimension
        args: {xarray_data: id.0, dim: 'epochs', operation: 'mean'}

  detrendedFluctuationMeanEpochs:
    save: True
    for_dataframe: True
    nodes:
      - id: 0
        derivative: Ep_DetrendedFluctuation.nc
      - id: 1
        node: aggregate_across_dimension
        args: {xarray_data: id.0, dim: 'epochs', operation: 'mean'}

  # ===== DFA long-window (120 s / 60 s overlap) ================================
  # DFA (detrended fluctuation) is window-length-sensitive; the 30 s battery epochs
  # are too short to probe slow (long-memory) dynamics. This SEPARATE prep re-epochs
  # the SAME denoised+bandpassed raw at 120 s / 60 s-overlap and feeds ONLY the DFA
  # node — the rest of the battery stays on PrepDur30Ov20.
  #
  # Window chosen 2026-07-09 from the per-dataset duration survey (duration_survey.py):
  # recording lengths are ketamine/perampanel 600 s, tiagabine 300 s, LSD 420-600 s,
  # psilocybin 244-427 s (cropped Infusion->Rest). Shortest recording = 244 s, so a
  # window comparable across ALL datasets must be <=244 s. 120 s is ~4x the 30 s scale
  # range yet fits every dataset with >=2 windows (>=3 with the 60 s overlap on the
  # short recordings) for within-recording averaging. sfreq stays 600 Hz so DFA box
  # sizes (in seconds) are comparable across datasets.
  #
  # NOTE (perf, full-scale): this recomputes ZapLine (the expensive adaptive step) a
  # second time per subject. If wall-clock matters at full scale, factor the denoised+
  # filtered CONTINUOUS raw into its own cached derivative and epoch both preps from it
  # (trades CPU for one large cached .fif/subject — see TODO.md §4).
  PrepDur120Ov60:
    overwrite: False
    save: True
    for_dataframe: False
    nodes:
      - id: 0
        derivative: PickedRaw.fif
      - id: 1
        node: zapline_denoise
        args: {mne_object: id.0, line_freq: 50.0, adaptive: True, n_harmonics: 2}
      - id: 2
        node: basic_preprocessing
        args:
          mne_object: id.1
          notch_filter: null
          filter_args:
            l_freq: 0.1
            h_freq: 150
          epoch_config:
            duration: 120.0
            overlap: 60.0
          resample: 600
          extra_artifacts: False

  Ep_DetrendedFluctuationDur120:
    save: True
    for_dataframe: False
    nodes:
      - id: 0
        derivative: PrepDur120Ov60.fif
      - id: 1
        node: antropy_detrended_fluctuation
        args: {data_like: id.0, dim: 'times'}

  detrendedFluctuationMeanEpochsDur120:
    save: True
    for_dataframe: True
    nodes:
      - id: 0
        derivative: Ep_DetrendedFluctuationDur120.nc
      - id: 1
        node: aggregate_across_dimension
        args: {xarray_data: id.0, dim: 'epochs', operation: 'mean'}

  detrendedFluctuationSDEpochsDur120:      # within-recording variability (meaningful with >=3 windows)
    save: True
    for_dataframe: True
    nodes:
      - id: 0
        derivative: Ep_DetrendedFluctuationDur120.nc
      - id: 1
        node: aggregate_across_dimension
        args: {xarray_data: id.0, dim: 'epochs', operation: 'std'}

  # ============================================================================
  # ===== EXPERIMENTAL (needs validation) ======================================
  # ============================================================================
  # "Scientific" MEG features PORTED from raw_to_classification@meeg_refactor via
  # the custom nodes in `experimental_features.py`. These are NOT part of the
  # validated classical battery above and have NOT been checked numerically
  # against the original r2c outputs — treat every column below as experimental.
  #
  #   v2 (phi / integrated information):  Ep_Atoms -> Ep_{InfoDyn,IID,IIT}
  #                                       -> {infodyn,iid,iit}{Mean,SD}Epochs
  #   v1:  Ep_FisherInformation -> fisherInformation{Mean,SD}Epochs
  #        Ep_PowerSpectrumMultitaper -> Ep_Harmonicity -> harmonicity{Mean,SD}Epochs
  #
  # Extra deps -> run these from the SEPARATE `neurodags-experimental` venv (numpy<2),
  # built by cluster/build_env.sh; the classical battery uses the main (numpy>=2) env:
  #   phyid      (git+https://github.com/Imperial-MIND-lab/integrated-info-decomp.git)
  #   neurokit2  (Fisher information)
  #   biotuner   (Harmonicity; pins numpy<2 -> hence the separate venv)
  #
  # WARNING: Ep_Atoms is HEAVY (PhiID per epoch x channel; 16 atoms x ~full time
  # axis) and produces a LARGE .nc. It is cached (save: True) so the three
  # atoms_results views (InfoDyn/IID/IIT) reuse it rather than recomputing PhiID.

  # ---- v2: phi atoms + integrated-information metrics (per-epoch, cached) ----
  Ep_Atoms:                       # EXPERIMENTAL — r2c single_atoms
    save: True
    for_dataframe: False
    nodes:
      - id: 0
        derivative: PrepDur30Ov20.fif
      - id: 1
        node: single_atoms
        args: {epochs: id.0, tau: 5, kind: gaussian, redundancy: MMI}

  Ep_InfoDyn:                     # EXPERIMENTAL — r2c atoms_results (InformationDynamics)
    save: True
    for_dataframe: False
    nodes:
      - id: 0
        derivative: Ep_Atoms.nc
      - id: 1
        node: atoms_results
        args: {atoms: id.0, key: InformationDynamics, aggregation_mode: mean-sum}

  Ep_IID:                         # EXPERIMENTAL — r2c atoms_results (IntegratedInformationDecomposition)
    save: True
    for_dataframe: False
    nodes:
      - id: 0
        derivative: Ep_Atoms.nc
      - id: 1
        node: atoms_results
        args: {atoms: id.0, key: IntegratedInformationDecomposition, aggregation_mode: mean-sum}

  Ep_IIT:                         # EXPERIMENTAL — r2c atoms_results (IntegratedInformationTheory)
    save: True
    for_dataframe: False
    nodes:
      - id: 0
        derivative: Ep_Atoms.nc
      - id: 1
        node: atoms_results
        args: {atoms: id.0, key: IntegratedInformationTheory, aggregation_mode: mean-sum}

  # ---- v1: Fisher information (per-epoch, cached) ----
  Ep_FisherInformation:           # EXPERIMENTAL — r2c fisher_information_feature
    save: True
    for_dataframe: False
    nodes:
      - id: 0
        derivative: PrepDur30Ov20.fif
      - id: 1
        node: fisher_information_feature
        args: {epochs: id.0, delay: 1, dimension: 3}

  # ---- v1: Harmonicity (multitaper power spectrum -> harmonicity, per-epoch, cached) ----
  Ep_PowerSpectrumMultitaper:     # EXPERIMENTAL — r2c spectrum_multitaper (feeds harmonicity)
    save: True
    for_dataframe: False
    nodes:
      - id: 0
        derivative: PrepDur30Ov20.fif
      - id: 1
        node: spectrum_multitaper
        args:
          epochs: id.0
          multitaper: {adaptive: False, low_bias: True, normalization: 'full', verbose: 0}

  Ep_Harmonicity:                 # EXPERIMENTAL — r2c feature_harmonicity + process_harmonicity_output
    save: True
    for_dataframe: False
    nodes:
      - id: 0
        derivative: Ep_PowerSpectrumMultitaper.nc
      - id: 1
        node: feature_harmonicity
        args: {power_spectrum: id.0, height: null, distance: null, bands: null}

  # ---- EXPERIMENTAL epoch aggregation -> dataframe features ----
  infodynMeanEpochs:              # EXPERIMENTAL
    save: True
    for_dataframe: True
    nodes:
      - id: 0
        derivative: Ep_InfoDyn.nc
      - id: 1
        node: aggregate_across_dimension
        args: {xarray_data: id.0, dim: 'epochs', operation: 'mean'}

  infodynSDEpochs:                # EXPERIMENTAL
    save: True
    for_dataframe: True
    nodes:
      - id: 0
        derivative: Ep_InfoDyn.nc
      - id: 1
        node: aggregate_across_dimension
        args: {xarray_data: id.0, dim: 'epochs', operation: 'std'}

  iidMeanEpochs:                  # EXPERIMENTAL
    save: True
    for_dataframe: True
    nodes:
      - id: 0
        derivative: Ep_IID.nc
      - id: 1
        node: aggregate_across_dimension
        args: {xarray_data: id.0, dim: 'epochs', operation: 'mean'}

  iidSDEpochs:                    # EXPERIMENTAL
    save: True
    for_dataframe: True
    nodes:
      - id: 0
        derivative: Ep_IID.nc
      - id: 1
        node: aggregate_across_dimension
        args: {xarray_data: id.0, dim: 'epochs', operation: 'std'}

  iitMeanEpochs:                  # EXPERIMENTAL
    save: True
    for_dataframe: True
    nodes:
      - id: 0
        derivative: Ep_IIT.nc
      - id: 1
        node: aggregate_across_dimension
        args: {xarray_data: id.0, dim: 'epochs', operation: 'mean'}

  iitSDEpochs:                    # EXPERIMENTAL
    save: True
    for_dataframe: True
    nodes:
      - id: 0
        derivative: Ep_IIT.nc
      - id: 1
        node: aggregate_across_dimension
        args: {xarray_data: id.0, dim: 'epochs', operation: 'std'}

  fisherInformationMeanEpochs:    # EXPERIMENTAL
    save: True
    for_dataframe: True
    nodes:
      - id: 0
        derivative: Ep_FisherInformation.nc
      - id: 1
        node: aggregate_across_dimension
        args: {xarray_data: id.0, dim: 'epochs', operation: 'mean'}

  fisherInformationSDEpochs:      # EXPERIMENTAL
    save: True
    for_dataframe: True
    nodes:
      - id: 0
        derivative: Ep_FisherInformation.nc
      - id: 1
        node: aggregate_across_dimension
        args: {xarray_data: id.0, dim: 'epochs', operation: 'std'}

  harmonicityMeanEpochs:          # EXPERIMENTAL
    save: True
    for_dataframe: True
    nodes:
      - id: 0
        derivative: Ep_Harmonicity.nc
      - id: 1
        node: aggregate_across_dimension
        args: {xarray_data: id.0, dim: 'epochs', operation: 'mean'}

  harmonicitySDEpochs:            # EXPERIMENTAL
    save: True
