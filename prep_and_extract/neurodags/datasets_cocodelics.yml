    fir:   "/home/yorguin/scratch/datasets/cocodelics/MEG_ketamine/meg_data_BIDS/**/*_meg.fif"
    local: "_data/MEG_ketamine/**/*_meg.fif"
  derivatives_path:
    fir:   "/home/yorguin/scratch/datasets/cocodelics/MEG_ketamine/derivatives_neurodags"
