# cocodelics MEG datasets for the neurodags feature-extraction pipeline.
#
# Mounts:
#   fir   -> Alliance cluster `fir`, real data under ~/scratch/datasets/cocodelics/
#   local -> optional local mirror for dev (paths are placeholders; data lives on fir)
#
# Source = the BIDS folder that actually holds sub-*/ses-*/meg/*_meg.fif for each
# dataset (verified on fir 2026-07-07): meg_data_BIDS/ for LSD/ketamine/perampanel/
# tiagabine, bids/ for psilocybin.
#
# derivatives_path points at a NEW `derivatives_neurodags/` dir so the existing
# coco-pipe `derivatives/features@prepDur30Ov20` stay intact as a parity reference.

lsd:
  name: MEG_LSD
  skip: False
  file_pattern:
    fir:   "/home/yorguin/scratch/datasets/cocodelics/MEG_LSDV2/meg_data_BIDS/**/*_meg.fif"
    local: "_data/MEG_LSDV2/**/*_meg.fif"
  derivatives_path:
    fir:   "/home/yorguin/scratch/datasets/cocodelics/MEG_LSDV2/derivatives_neurodags"
    local: "_outputs/MEG_LSDV2"

