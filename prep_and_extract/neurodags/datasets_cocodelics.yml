# cocodelics MEG datasets for the neurodags feature-extraction pipeline.
#
# Mounts:
#   fir   -> Alliance cluster `fir`
#   local -> optional local mirror for dev (paths are placeholders; data lives on fir)
#
# Source = the freshly-bidsified BIDS produced by the standalone bidsification scripts
# (RAN 2026-07-08), all under the shared, durable project dir:
#   /home/yorguin/projects/rrg-kjerbi/shared/neuro-cocodelics/bids/MEG_<D>/sub-*/ses-*/meg/*_meg.fif
# (Earlier this pointed at the per-dataset scratch `bids`/`meg_data_BIDS`; scratch purges at 60d,
#  the shared dir is backed-up. LSD there was bidsified from scratch MEG_LSDV2 — see TODO §3.)
#
# derivatives_path -> a sibling `derivatives_neurodags/MEG_<D>` under the same shared dir
# (yorguin-owned, group-writable), keeping the coco-pipe reference derivatives untouched.

lsd:
  name: MEG_LSD
  skip: False
  file_pattern:
    fir:   "/home/yorguin/projects/rrg-kjerbi/shared/neuro-cocodelics/bids/MEG_LSD/**/*_meg.fif"
    local: "_data/MEG_LSD/**/*_meg.fif"
  derivatives_path:
    fir:   "/home/yorguin/projects/rrg-kjerbi/shared/neuro-cocodelics/derivatives_neurodags/MEG_LSD"
    local: "_outputs/MEG_LSD"

ketamine:
